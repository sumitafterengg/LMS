services:
  forms-api:
    build:
      context: ./institute-platform/apps/forms-api
      dockerfile: Dockerfile
    container_name: forms-api
    ports:
      - "8095:8000"
    volumes:
      - forms-db:/app/db
      - forms-media:/app/media
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-coolify-demo-key-1234567890
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - SERVE_MEDIA_IN_PRODUCTION=True
      - DATABASE_PATH=/app/db/db.sqlite3
    restart: unless-stopped

  website:
    build:
      context: ./institute-platform/apps/website
      dockerfile: Dockerfile
    container_name: website
    ports:
      - "3095:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8095
    restart: unless-stopped
    depends_on:
      - forms-api

volumes:
  forms-db:
  forms-media:
